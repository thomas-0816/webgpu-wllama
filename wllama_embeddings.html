<!DOCTYPE html>
<html lang="en">
  <head>
    <title>wllama embeddings</title>
    <style>pre { white-space: collapse; word-break: break-all; }</style>
  </head>
  <body>
    <h2>nomic embed text v2 Q4_K_M (0.3 GB)</h2>
    <div>Prompt: When was Beethoven born?</div>
    <pre id="progress"></pre>
    <pre id="output"></pre>
    <script type="module">
      import { Wllama } from "./node_modules/@wllama/wllama/esm/index.min.js";
      (async () => {
        const wllama = new Wllama({ default: "./node_modules/@wllama/wllama/esm/wasm/wllama.wasm" });
        const progress = document.getElementById("progress");
        const output = document.getElementById("output");
        await wllama.loadModelFromUrl("./models/nomic-embed-text-v2-moe.Q4_K_M.gguf", {
          embeddings: true, n_gpu_layers: 9999, pooling_type: "mean",
          n_ctx: 512, n_batch: 512, n_ubatch: 512,
          progressCallback: ({ loaded, total }) => progress.innerText = Math.round((loaded / total) * 100) + "%"
        });
        progress.innerText = "loaded.";
        const result = await wllama.createEmbedding({ input: ["When was Beethoven born?"] });
        output.innerText = JSON.stringify(result.data[0].embedding).replace(/,/g, ', ');
        await wllama.exit();
      })();
    </script>
  </body>
</html>
