<!DOCTYPE html>
<html lang="en">
  <head>
    <title>wllama LFM2.5 8B</title>
    <link rel="icon" href="data:,">
    <style>pre { white-space: pre-wrap; width: 50vw; } #reasoning { font-style: italic; }</style>
  </head>
  <body>
    <pre id="progress"></pre>
    <pre id="reasoning"></pre>
    <pre id="output"></pre>
    <script type="module">
      import { Wllama } from "./node_modules/@wllama/wllama/esm/index.min.js";
      (async () => {
        const wllama = new Wllama({ default: "./node_modules/@wllama/wllama/esm/wasm/wllama.wasm" });
        const progress = document.getElementById("progress");
        const reasoning = document.getElementById("reasoning");
        const output = document.getElementById("output");
        await wllama.loadModelFromUrl("./models/LFM2.5-8B-A1B-Q4_K_M.gguf", {
          n_ctx: 2048, n_gpu_layers: 9999, reasoning_budget_tokens: 0,
          progressCallback: ({ loaded, total }) => progress.innerText = Math.round((loaded / total) * 100) + "%"
        });
        progress.innerText = "loaded.";
        const response = await wllama.createChatCompletion({
          messages: [{ role: "user", content: "Was ist die minimale Mehrfach-Bedingungsabdeckung?" }],
          temperature: 0.2, top_p: 80, penalty_repeat: 1.05,
          max_tokens: 4096, stream: true, timings_per_token: true
        });
        for await (const chunk of response) {
          progress.innerText = chunk.timings?.prompt_per_second.toFixed(2) + " pt/s " +
            chunk.timings?.predicted_per_second.toFixed(2) + " t/s";
          reasoning.innerText += chunk.choices[0].delta.reasoning_content ?? "";
          output.innerText += chunk.choices[0].delta.content ?? "";
        }
        await wllama.exit();
      })();
    </script>
  </body>
</html>
