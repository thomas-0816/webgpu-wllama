<!DOCTYPE html>
<html lang="en">
  <head>
    <title>wllama image recognition</title>
    <style>pre { white-space: pre-wrap; width: 50vw; }</style>
  </head>
  <body>
    <h2>Alibaba Qwen3.5 2B Q4_K_XL (1.2 GB)</h2>
    <img src="./demo_128.jpeg">
    <div>Prompt: Describe this image in one sentence.</div>
    <pre id="progress"></pre>
    <pre id="output"></pre>
    <script type="module">
      import { Wllama } from "./node_modules/@wllama/wllama/esm/index.min.js";
      (async () => {
        const wllama = new Wllama({ default: "./node_modules/@wllama/wllama/esm/wasm/wllama.wasm" });
        const progress = document.getElementById("progress");
        const output = document.getElementById("output");
        await wllama.loadModelFromUrl({
          url: "./models/Qwen3.5-2B-UD-Q4_K_XL.gguf", mmprojUrl: "./models/Qwen3.5-2B-mmproj-BF16.gguf"
        }, {
          n_ctx: 131072, n_gpu_layers: 9999, reasoning: false,
          progressCallback: ({ loaded, total }) => progress.innerText = Math.round((loaded / total) * 100) + "%"
        });
        progress.innerText = "loaded.";
        const response = await wllama.createChatCompletion({
          messages: [{role: "user", content: [
            { type: "image", data: await fetch("./demo_128.jpeg").then(r => r.arrayBuffer()) },
            { type: "text", text: "Describe this image in one sentence." }
          ]}],
          temperature: 0.7, min_p: 0.0, top_p: 0.8, top_k: 20, repeat_penalty: 1.0,
          max_tokens: 1024, stream: true, timings_per_token: true
        });
        for await (const chunk of response) {
          progress.innerText = chunk.timings?.prompt_per_second.toFixed(2) + " pt/s " +
            chunk.timings?.predicted_per_second.toFixed(2) + " t/s";
          output.innerText += chunk.choices[0].delta.reasoning_content ?? chunk.choices[0].delta.content ?? "";
        }
        await wllama.exit();
      })();
    </script>
  </body>
</html>
